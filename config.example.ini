gaveta =
# Sucursal FEL de 4 caracteres en mayúscula A-Z/0-9, por ejemplo A001.
sucursal =
# Punto de facturación de 3 dígitos, habilitado en FF.
punto_de_facturacion =
# Nombre exacto de la impresora de Windows; opcional.
Nombre_impresora =
# efectivo: abre si alguna forma de pago es Efectivo/Cash.
# siempre: abre después de procesar correctamente cada orden válida.
modo_apertura_gaveta = efectivo

[FiscalSequence]
# odoo conserva el protocolo 5.1.9 sin corregir desbordamientos.
# local requiere perfil completo, SQLite inicializado y TPV activado (módulo 4.1.5 recomendado).
# Copiar los valores de Vinculacion Factura Facil del TPV de esta compania.
modo = odoo
# RUC del emisor que usa el Agente FF. No es el RUC del cliente de la venta.
emisor =
# Debe coincidir con el ambiente configurado en el Agente FF: 1 produccion, 2 pruebas.
ambiente =
# Nombre exacto de la base, ID interno de res.company e ID de pos.config.
# No utilizar el nombre POS/xxxxx ni el ID de pos.session.
odoo_database =
odoo_company_id =
odoo_pos_config_id =
